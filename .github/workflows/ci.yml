name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      # shellcheck is preinstalled on ubuntu-latest runners.
      # Threshold: --severity=error. The codebase currently has 0 errors but
      # 7 warning-level (SC2034, SC2155) and 16 info/style-level pre-existing
      # findings; gating at error keeps CI green on the current code while
      # still catching real breakage. Tighten to warning once those are fixed.
      - name: Lint shell scripts
        run: shellcheck --severity=error shared/hooks/*.sh shared/hooks/lib/*.sh scripts/*.sh

  sync-idempotency:
    name: Sync idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Run sync twice and assert no drift
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          # git init so sync-to-repo.sh skips its interactive non-git-repo prompt
          git init -q "$TMP"
          git -C "$TMP" config user.name "ci"
          git -C "$TMP" config user.email "ci@example.com"

          ./scripts/sync-to-repo.sh "$TMP" all
          git -C "$TMP" add -A
          git -C "$TMP" commit -m baseline -q

          ./scripts/sync-to-repo.sh "$TMP" all

          # The hooks reconciler backs up pre-existing hooks.json/settings.json
          # as *.bak on every run, so the second sync legitimately creates two
          # .bak files. Everything else must be byte-identical.
          DRIFT="$(git -C "$TMP" status --porcelain | grep -v '\.bak$' || true)"
          if [ -n "$DRIFT" ]; then
            echo "Sync is not idempotent — drift detected after second run:"
            echo "$DRIFT"
            exit 1
          fi
          echo "Sync is idempotent (no drift beyond reconciler .bak backups)."

  # macOS + non-C locale reproduction of the production control-plane
  # environment (#194). Linux CI is structurally blind to the BSD/GNU +
  # locale divergence bug class: pgrep -f illegal-byte-sequence false
  # negatives, French-formatted `ps -o lstart` breaking staleness detection,
  # grep ERE portability (anti-gutting-scan.sh carries BSD-portability
  # comments), and the #129/#132 tmp-path / global-gitignore cluster — all
  # pass on ubuntu where the code does not run. This job runs only the
  # shell-control-plane test subset (suites that drive a *.sh hook or
  # scripts/*.sh via subprocess), not the full suite, to keep macOS minutes
  # bounded. continue-on-error while the documented flakes are burned down;
  # remove it to make the job required once green. Related: #189.
  shell-control-plane-macos:
    name: Shell control-plane (macOS, fr_FR.UTF-8)
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      LANG: fr_FR.UTF-8
      LC_ALL: fr_FR.UTF-8
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Confirm the non-C locale resolved on the runner
        shell: bash
        run: |
          set -euo pipefail
          # Fail loud if fr_FR.UTF-8 is unavailable — a silent fallback to C
          # would make this job green for the wrong reason (the locale bug
          # class only reproduces under a real non-C UTF-8 locale).
          locale -a | grep -qiE '^fr_FR\.(UTF-8|utf8)$'
          locale

      - name: Select and run the shell-control-plane test subset
        shell: bash
        run: |
          set -euo pipefail
          # Subset = every test file that drives a *.sh control-plane script
          # (hook or scripts/*.sh) via subprocess, detected by a *.sh token
          # reference. Selected dynamically so the subset self-maintains as
          # suites are added; ci.yml is the only file in scope for #194, so the
          # selection lives here rather than behind a pytest marker. The token
          # boundary ([^a-zA-Z0-9]|$) is portable ERE (BSD + GNU grep) and
          # drops false matches like `github.sha`.
          # `|| true`: grep exits 1 on no-match, which under `set -eo
          # pipefail` would abort at this assignment before the guard
          # below runs — swallow it so the guard prints its diagnostic.
          subset=$(grep -rlE '\.sh([^a-zA-Z0-9]|$)' tests --include='test_*.py' | sort || true)
          if [ -z "$subset" ]; then
            echo "No shell-control-plane tests matched — selection is broken." >&2
            exit 1
          fi
          echo "Selected shell-control-plane test files:"
          echo "$subset" | sed 's/^/  /'
          # Intentional word-split on the newline-separated file list; paths
          # carry no spaces. Default macOS /bin/bash is 3.2 (no mapfile).
          # shellcheck disable=SC2086
          python -m pytest $subset -q

  # A permanently red check is noise that hides the day it fails for a real
  # reason (#129): on any red gate job, land the failure in the backlog as a
  # GitHub issue instead of an unread checks tab. Dedup contract: one open
  # issue per failing job, keyed on the stable "CI red: <job>" title marker —
  # consecutive red runs add a comment referencing the new run + commit
  # rather than filing duplicates.
  report-red:
    name: File issue on red
    runs-on: ubuntu-latest
    needs: [test, shellcheck, sync-idempotency]
    if: failure()
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update a "CI red" issue per failed job
        env:
          GH_TOKEN: ${{ github.token }}
          # On pull_request, GITHUB_SHA is the throwaway merge commit; prefer
          # the PR head SHA the developer actually pushed (empty on push runs).
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_SHELLCHECK: ${{ needs.shellcheck.result }}
          RESULT_SYNC: ${{ needs['sync-idempotency'].result }}
        run: |
          set -euo pipefail
          # Default runner env only ($GITHUB_*): no user-controlled values are
          # interpolated into this script's text.
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          short_sha="${sha:0:7}"
          report() {
            local job="$1" marker existing body
            marker="CI red: $1"
            body="$(printf 'CI is red for job **%s** on `%s`.\n\n- Run: %s\n- Commit: %s (%s)\n' \
              "$job" "$branch" "$run_url" "$sha" "$short_sha")"
            # List API + client-side title match, not --search: the Search
            # index is eventually consistent and can miss a just-filed issue,
            # double-filing on near-simultaneous red runs.
            existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
              --json number,title \
              | jq -r --arg m "$marker" 'map(select(.title | startswith($m)))[0].number // empty')"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$marker @ $short_sha" --body "$body"
            fi
          }
          [ "$RESULT_TEST" = "failure" ] && report "Pytest suite"
          [ "$RESULT_SHELLCHECK" = "failure" ] && report "ShellCheck"
          [ "$RESULT_SYNC" = "failure" ] && report "Sync idempotency"
          exit 0
