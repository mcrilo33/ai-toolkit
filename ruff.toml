# Base Ruff config (lint and format). sync.sh proposes it to a Python host that has no linter config, once; it is never overwritten.
target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by the formatter)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = [
    "F811",  # a fixture imported from conftest is shadowed by the test argument
    "E702",  # one-line statements joined with ';'
]

[format]
quote-style = "double"
indent-style = "space"
