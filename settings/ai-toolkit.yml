# ai-toolkit — declarative behavior config (issue #142)
#
# The SINGLE source of truth for two families of "how the toolkit behaves"
# settings that used to be scattered across shell defaults and per-agent
# frontmatter:
#
#   - model + effort routing (spoke driver, sub-agents, cycle steps, AFK
#     answerer, per-label overrides), and
#   - the integration `base_branch` the hub operates on and that spokes start
#     from and land to.
#
# The sync pipeline (scripts/sync-to-repo.sh + scripts/metadata_parser.py)
# reads this file to stamp each agent's `model:` frontmatter, emit the
# spoke-default env file that worktree-new.sh sources, and set
# `git config ai-toolkit.base-branch`. Change a value here + re-sync to change
# the corresponding behavior — no other edits.
#
# Effort defaults to `max` everywhere it is omitted.

# The integration branch THIS repo (ai-toolkit itself) operates on and that its
# spokes branch from and land to. Empty ⇒ auto-detection (origin/HEAD → main); see
# the wt_base_branch resolver in shared/hooks/lib/base-branch.sh (issue #117).
#
# ┌─ DOWNSTREAM / CONSUMING PROJECTS — READ BEFORE EDITING ──────────────────────┐
# │ Do NOT put your project's branch here. This is the ai-toolkit SOURCE config:  │
# │ it is committed, `sync-to-repo.sh` copies its effect into EVERY consuming     │
# │ project, and it governs ai-toolkit's OWN hub. A branch name here (e.g. a       │
# │ feature branch) breaks the ai-toolkit drain and propagates to all downstreams. │
# │                                                                                │
# │ To set a CONSUMING project's base branch, in THAT project's shell/session set  │
# │   export AI_TOOLKIT_BASE_BRANCH=<your-branch>                                   │
# │ The resolver honors it (config > AI_TOOLKIT_BASE_BRANCH > origin/HEAD) and it   │
# │ SURVIVES re-sync — unlike `git config ai-toolkit.base-branch`, which every      │
# │ sync overwrites from this file. Keep it in your shell profile or a per-project  │
# │ env (e.g. direnv .envrc) so it persists. See docs/downstream-setup.md.         │
# │ NOTE: the git config key is HYPHENATED (`ai-toolkit.base-branch`); the          │
# │ camelCase `ai-toolkit.baseBranch` is a DIFFERENT key the resolver ignores.      │
# └────────────────────────────────────────────────────────────────────────────┘
base_branch:

# Global on/off switch (issue #154). The master toggle for ALL toolkit
# enforcement + capture: the pre-push/commit-msg git gates, the CC scope guards,
# marker emission, and telemetry. `true` (default, or absent) keeps today's full
# enforcement; `false` makes every git + CC hook pass through so you can commit/
# push freely on your own branch. Sync materializes this into
# `git config ai-toolkit.enabled` (the durable, version-pinnable DEFAULT). For a
# quick, sync-safe flip that survives re-syncs, use `ai-toolkit off` / `ai-toolkit
# on` (drops/removes a <git-common-dir> marker that WINS over this default).
# Keep the value on its own line — an inline `# comment` after it is NOT stripped
# by the sync parser and would be read as part of the value.
enabled: true

# Client-side telemetry / Langfuse target (issue #228). The SINGLE view of "is
# telemetry on, and where does it go" — previously scattered across the
# AI_TOOLKIT_OTEL env toggle, a hardcoded LANGFUSE_HOST default, the
# AI_TOOLKIT_OTEL_SPAN_ENDPOINT var, and the collector config. Consumers read
# these as env -> config -> hardcoded default: a live env var (AI_TOOLKIT_OTEL,
# LANGFUSE_HOST, ...) still WINS, so existing env-driven setups keep working;
# this file supplies the default where the operator set nothing.
#
# SECRET BOUNDARY (hard): this file is committed and synced into downstream
# projects, so the Langfuse SECRET key / LANGFUSE_BASIC_AUTH MUST NEVER live here
# (secrets-scan + the security rule would block it, and it would leak downstream).
# The secret stays in ~/.afk-telemetry (gitignored, per-machine), read by
# wt_resolve_langfuse_auth. Only the PUBLIC settings below belong here.
#
# `enabled` replaces the AI_TOOLKIT_OTEL toggle. This repo (the hub) captures
# telemetry, so it ships `true`. A fresh DOWNSTREAM project should ship
# `enabled: false` (opt-in-off) and point host/otlp_endpoint at its OWN Langfuse
# rather than inheriting localhost. Absent/blank ⇒ the consumer keeps its own
# default (today: on) — set `false` explicitly to opt a downstream out.
# The collector's own pipeline config (dashboard/langfuse/otelcol.yaml) is
# separate infra and is NOT generated from this section.
telemetry:
  enabled: true
  langfuse:
    host: http://localhost:3000
    project: proj-quicktest
    # public_key is public (safe to commit); the SECRET key is never stored here.
    # Keep each value on its own line — an inline `# comment` is NOT stripped by
    # the sync parser and would be read as part of the value.
    public_key: pk-lf-quicktest
    otlp_endpoint: http://localhost:4318

# Hub batch/dispatch hardening (issue #151). Caps how many spokes the hub runs
# concurrently across /next-batch and /afk, so wide parallelism can't drive load
# high enough to starve the co-located Langfuse (the #151 telemetry-loss trigger).
batch:
  # Max spokes running at once. Empty ⇒ auto min(2, cores/4); set a positive
  # integer to override. batch-plan.sh truncates the batch so (in-flight +
  # newly-dispatched) never exceeds this.
  # Sized for the M5 Max hub (18 cores / 48 GB) — hardware headroom is fine at 6
  # (measured 2026-07-08: load 6/18, 59% RAM free). The binding constraint is the
  # weekly subscription budget, not the box: with Opus spokes the account limit
  # hits before CPU/RAM. Capped at 3 to stretch the weekly budget across more of
  # the backlog; raise toward 6 when budget is ample. #188/#203 (the failure
  # modes that widen with the batch) have landed, so 6 is safe hardware-wise.
  concurrency_cap: 8
  # Seconds to wait between consecutive spawns in one batch, so first-push full
  # suites don't all hit at once. Empty ⇒ 45; 0 disables the stagger.
  stagger_seconds: 20

model:
  # The interactive spoke driver launched by worktree-new.sh. Routine spokes run
  # Sonnet at high effort (2026-07-15 budget routing): no `[1m]` tier, so context
  # compacts at the standard window instead of riding the long-context premium.
  # Escalate a genuinely reasoning-heavy issue via the `lane:reasoning` label
  # (model.overrides.by_label below) or an explicit `Model:` line in the issue.
  spoke:
    model: claude-opus-4-8
    effort: high

  # Model per solo-cycle step (issue #182). Realized by delegating each step to
  # its routed subagent (red→tdd-red, green→tdd-green, review→code-review); the
  # solo-cycle skill instructs the delegation and `cycle_step_effective_model`
  # in ai_toolkit_config.py resolves the model. ONLY the delegated steps are
  # listed — anchor and push are mechanical (git plumbing, marker emission) with
  # no subagent, so they always run on the spoke driver model; declaring a model
  # for them would be dead config (nothing consumes it). A per-step value here
  # MUST match its delegate's `model.subagents` entry (a test binds them, so a
  # drift fails loud); an absent step fails open to the spoke driver model.
  cycle_steps:
    red:
      model: claude-opus-4-8
      effort: high
    green:
      model: claude-sonnet-5
      effort: high
    review:
      model: claude-opus-4-8
      effort: high

  # Per sub-agent model routing (issue #141): Fable is scarce, so it is reserved
  # for the design/plan agents; Opus 4.8 for the reasoning-heavy ones; Sonnet 5
  # for the capable-but-routine ones; Haiku for none. Sync stamps these into
  # each agent's claude `model:`/`effort:` frontmatter.
  subagents:
    architect:
      model: claude-fable-5
      effort: max
    planner:
      model: claude-fable-5
      effort: max
    debug:
      model: claude-opus-4-8
      effort: max
    security-reviewer:
      model: claude-opus-4-8
      effort: max
    code-review:
      model: claude-opus-4-8
      effort: high
    tdd-red:
      model: claude-opus-4-8
      effort: high
    devops:
      model: claude-opus-4-8
      effort: max
    # Accurate Scope: derivation is the whole value of bug-scoper (#220); route
    # it to the strongest reasoning model.
    bug-scoper:
      model: claude-opus-4-8
      effort: high
    tdd-green:
      model: claude-sonnet-5
      effort: high
    tdd-refactor:
      model: claude-sonnet-5
      effort: high
    refactor:
      model: claude-sonnet-5
      effort: high
    documentation:
      model: claude-sonnet-5
      effort: high

  # The reasoning answerer that resolves parked spokes under /afk. SCHEMA ONLY
  # for now — the AFK answerer wiring lands in a follow-up (see issue #142).
  afk:
    answerer:
      model: claude-opus-4-8
      effort: high

  # Per-issue-label model overrides. An issue carrying a listed label spawns its
  # spoke on the override model. Empty by default.
  overrides:
    by_label:
      lane:reasoning:
        model: claude-opus-4-8
        effort: max
