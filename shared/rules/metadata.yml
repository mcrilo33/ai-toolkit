# Per-tool frontmatter for rules.
# Key = filename without .md extension.
# Shared fields at top level; per-tool overrides nested under tool name.
# applyTo: "**" means always active for Copilot.

guidelines:
  name: "Guidelines"
  description: "Agent behavior, clarification, autonomy, prohibitions, and response style"
  applyTo: "**"
  alwaysApply: true

security:
  name: "Security"
  description: "Secrets management, credentials handling, macOS Keychain storage, input validation, and dependency security"
  applyTo: "**"
  alwaysApply: true

code-quality:
  name: "Code Quality"
  description: "Design principles (clarity, single responsibility, consistency), error handling, logging, performance, documentation, surgical changes, and dependency management"
  applyTo: "**/*.{py,ts,tsx,js,jsx,go,rs,java}"
  globs: "**/*.{py,ts,tsx,js,jsx,go,rs,java}"
  paths: "**/*.{py,ts,tsx,js,jsx,go,rs,java}"
  alwaysApply: false

python-style:
  name: "Python Standards"
  description: "Type annotations, docstrings, naming, imports, modern Python, Pydantic, and async patterns"
  applyTo: "**/*.py"
  globs: "**/*.py"
  paths: "**/*.py"
  alwaysApply: false

gitignore-template:
  name: "Gitignore Template"
  description: "Standard .gitignore patterns for environment, IDE, dependencies, build artifacts, and secrets"
  applyTo: "**/.gitignore"
  globs: "**/.gitignore"
  paths: "**/.gitignore"
  alwaysApply: false

markdown-style:
  name: "Markdown Style"
  description: "Markdown structure, formatting, code blocks, lists, links, tables, and README conventions"
  applyTo: "**/*.md"
  globs: "**/*.md"
  paths: "**/*.md"
  alwaysApply: false

mermaid-conventions:
  name: "Mermaid Conventions"
  description: "Diagram type selection, flowcharts, sequence, class, ER, and state diagrams"
  applyTo: "**/*.md"
  globs: "**/*.md"
  paths: "**/*.md"
  alwaysApply: false

pytest-conventions:
  name: "Pytest Conventions"
  description: "Test file layout, naming, AAA structure, fixtures, parametrize, mocking, and assertions"
  applyTo: "**/test_*.py,**/tests/**/*.py,**/conftest.py"
  globs: "**/test_*.py,**/tests/**/*.py,**/conftest.py"
  paths: "**/test_*.py,**/tests/**/*.py,**/conftest.py"
  alwaysApply: false

workflow:
  name: "Development Workflow"
  description: "Task lifecycle (SOURCE → DEFINE → EXECUTE → CLOSE), TDD, and related skills"
  applyTo: "**"
  alwaysApply: false

operational-gotchas:
  name: "Operational Gotchas"
  description: "Recurring mechanical traps a spoke hits in this repo's commit/push cage — RED-trailer node-IDs and inline -m mechanics, gauntlet ambiguous-unicode lint, the working-tree push gate (don't interleave the next RED with an in-flight push), the full-suite real-ref hazard, testmon first-push seeding, merge-main-before-push, review-artifact @{upstream} hash base, and LC_ALL=C locale wrappers. Teaches how to satisfy the existing gates, never to bypass them."
  applyTo: "**"
  globs: "**"
  paths: "**"
  alwaysApply: false

github-actions:
  name: "GitHub Actions"
  description: "Workflow structure, SHA pinning, permissions, secrets, caching, and job conventions for GitHub Actions"
  applyTo: ".github/workflows/*.yml,.github/workflows/*.yaml"
  globs: ".github/workflows/*.yml,.github/workflows/*.yaml"
  paths: ".github/workflows/*.yml,.github/workflows/*.yaml"
  alwaysApply: false

agent-orchestration:
  name: "Agent Orchestration"
  description: "When to spawn specialist agents, parallel execution, multi-perspective review, and delegation protocol"
  applyTo: "**"
  alwaysApply: true

planning-hub:
  name: "Planning Hub"
  description: "Role of a main-checkout session in the parallel-worktrees workflow — hub stays on main, dispatches spokes via start-task, merges and tears down, never writes task code. Surfaced on demand for hub sessions (via the hub skill), not auto-applied to every session."
  alwaysApply: false

issue-hygiene:
  name: "Issue Hygiene"
  description: "What a dispatchable issue must contain so the /afk scheduler can batch and order it — a mandatory Scope: line of touched files/globs (missing or '*' means exclusive) plus a Gate: none|plan line, with genuine ordering expressed as native GitHub blocked-by dependencies rather than file overlap. Programmatic filers emit the footer too. Surfaced on demand when authoring issues, not auto-applied to every session."
  alwaysApply: false

afk-answering:
  name: "AFK Answering"
  description: "How to answer a parked spoke on the human's behalf during an unattended /afk drain — reason about the prompt with a thinking budget, answer in the interest of the issue contract and repo conventions, prefer the spoke's own recommendation, and escalate (blocked/N) only when the decision is irreversible, outward-facing, or scope-changing. Surfaced on demand for the /afk answerer, not auto-applied to every session."
  alwaysApply: false

library-research:
  name: "Library Research"
  description: "Library documentation research using Context7 — resolve, fetch, and answer from current docs for any language"
  alwaysApply: false

scientific-integrity:
  name: "Scientific Integrity"
  description: "No data leakage from eval/ground truth into prompts, and mechanism-first reasoning over metric chasing"
  applyTo: "**"
  alwaysApply: true
