# Per-tool frontmatter for skills.
# Key = skill directory name.
# Shared fields at top level; per-tool overrides nested under tool name.

land:
  name: "land"
  description: "Land a finished task from the hub: verify the spoke pushed, merge into the default branch, run the suite, push, tear down the worktree, and close the issue. Use on the hub when the user says /land <id>, 'land it', or a branch shows pushed → mergeable."
  allowed-tools: "run_in_terminal get_changed_files read_file grep_search get_errors"
  argument-hint: "[issue number, slug, or branch]"

solo-cycle:
  name: "solo-cycle"
  description: "Per-subtask cycle for solo, PR-less work: anchor issue, RED test, GREEN implementation, one code-review per subtask, then push as the ship gate. Use when working without PRs, when the user says /cycle, 'solo flow', or wants commit+push per subtask with full gates."
  allowed-tools: "run_in_terminal get_changed_files read_file grep_search get_errors"
  argument-hint: "[subtask description or issue number]"

quick:
  name: "quick"
  description: "Express-interactive lane: build a small fix conversationally from the hub session on its own branch/worktree, keeping push-time gates (lint/typecheck/tests) but dropping spoke ceremony — no issue, no source-task, no tmux session, no PLAN gate, no RED-first, no review artifact. Use when the user says /quick <slug> or wants a quick interactive fix without a full cycle."
  allowed-tools: "run_in_terminal get_changed_files read_file grep_search get_errors"
  argument-hint: "[slug]"

brainstorming:
  name: "brainstorming"
  description: "Refine a rough idea into an agreed spec before any code is written — Socratic clarification, alternatives, and sign-off. Use at the start of DEFINE when a request is ambiguous or open-ended, or when the user says 'brainstorm', 'help me design', or 'I'm thinking about'."
  allowed-tools: "read_file semantic_search create_file"
  argument-hint: "[rough idea or feature to refine]"

context-map:
  name: "context-map"
  description: "Analyze the blast radius of a task — map files, dependencies, tests, and risks before implementation. Use when scope is unclear, multiple files are involved, or user says /map or 'analyze impact'."
  allowed-tools: "grep_search semantic_search read_file"
  argument-hint: "[task description or issue reference]"

iterative-retrieval:
  name: "iterative-retrieval"
  description: "Progressively refine context retrieval in a bounded 3-cycle loop (dispatch, evaluate, refine) when the files or terminology a task needs are unknown up front. Use when gathering context for a subagent, when a search misses because the codebase uses unfamiliar terms, or when a task fails with missing/too-much context. Triggers on 'find where X is handled' and subagent context gathering."
  allowed-tools: "grep_search semantic_search read_file"
  argument-hint: "[task or behavior to gather context for]"

create-readme:
  name: "create-readme"
  description: "Create a README.md file for a project. Use ONLY when explicitly asked to create a new README."
  allowed-tools: "read_file create_file semantic_search"

git-commit:
  name: "git-commit"
  description: "Stage changes, generate conventional commit messages, and execute git commits. Use when user asks to commit, says /commit, or wants to create a git commit."
  allowed-tools: "run_in_terminal get_changed_files"

generate-docs:
  name: "generate-docs"
  description: "Generate or update documentation — docstrings, README, API docs, inline comments. Use ONLY when explicitly asked."
  allowed-tools: "read_file replace_string_in_file create_file semantic_search"

generate-tests:
  name: "generate-tests"
  description: "Generate or update pytest tests — unit, integration, TDD mode. Use ONLY when explicitly asked."
  allowed-tools: "read_file create_file replace_string_in_file run_in_terminal"

source-task:
  name: "source-task"
  description: "Fetch a task and create a feature branch from a GitHub issue or ad-hoc request. Use when the user says /source or wants to begin work."
  allowed-tools: "run_in_terminal"
  argument-hint: "[GitHub issue number or URL]"

start-task:
  name: "start-task"
  description: "Dispatch a planned task from the planning hub into a running worktree: draft and create the GitHub issue, spawn the worktree on its branch, and seed the spoke's first prompt via worktree-new.sh. Use in the planning session when the user says 'start this work', 'spin it up', or 'let's build X' after scope is clear."
  allowed-tools: "run_in_terminal read_file grep_search"
  argument-hint: "[task title or decided scope]"

hub:
  name: "hub"
  description: "Orient a fresh planning-hub session and dispatch from it: survey in-flight worktrees, open issues, and mergeable branches, then propose the next move (start an unstarted issue, merge a pushed branch, tear down) and act only on confirmation. Use on the main checkout when the user says /hub, 'what's in flight', or 'hub status'."
  allowed-tools: "run_in_terminal read_file grep_search"

next-batch:
  name: "next-batch"
  description: "Compute and dispatch the next set of issues that can run concurrently: batch-plan.sh reads the open backlog in one gh api graphql round-trip, ranks ready issues by critical-path depth, greedily packs a disjoint-scope batch (honoring in-flight spoke scopes), then spawns each via worktree-new.sh. Use on the main checkout when the user says /next-batch, 'dispatch the next batch', or 'what can run in parallel right now'. Independent of /afk."
  allowed-tools: "run_in_terminal read_file grep_search"

afk:
  name: "afk"
  description: "Drain the backlog unattended: the hub toggle that, for a bounded window or until the backlog is empty, keeps plan→dispatch→auto-answer→auto-land→reap running with zero human input via hub-afk.sh. A parked spoke is answered on the human's behalf by a reasoning answerer (the afk-answering rule) or escalated to blocked. Use on the main checkout when stepping away — '/afk <duration>', '/afk until HH:MM', '/afk drain', plus '/afk off' and '/afk status'."
  allowed-tools: "run_in_terminal read_file grep_search"
  argument-hint: "[<duration> | until HH:MM | drain | off | status]"

tdd-workflow:
  name: "tdd-workflow"
  description: "Guide through TDD red-green-refactor cycle."
  argument-hint: "[feature or behavior to implement]"

pytest-coverage:
  name: "pytest-coverage"
  description: "Run pytest with coverage, find uncovered lines, and add tests to reach 100%. Use when user asks to increase coverage, check coverage, or get to 100%."
  allowed-tools: "run_in_terminal read_file create_file replace_string_in_file"
  argument-hint: "[module or file to cover]"

ci-cd-review:
  name: "ci-cd-review"
  description: "Review, audit, or design GitHub Actions CI/CD workflows — security, optimization, testing, and deployment. Use when user asks to review a workflow, audit CI/CD, or design a pipeline."
  allowed-tools: "read_file semantic_search"
  argument-hint: "[workflow file or aspect: security|optimization|testing|deployment]"

acquire-codebase-knowledge:
  name: "acquire-codebase-knowledge"
  description: "Map, document, or onboard into an existing codebase. Produces seven docs in docs/codebase/ covering stack, structure, architecture, conventions, integrations, testing, and concerns. Use when the user says 'map this codebase', 'document this architecture', 'onboard me', or 'create codebase docs'."
  allowed-tools: "run_in_terminal read_file create_file semantic_search list_dir"
  argument-hint: "[focus area: stack|structure|architecture|conventions|integrations|testing|concerns]"

verify-rules:
  name: "verify-rules"
  description: "Verify all instruction rules are loaded in the current conversation — returns PASS or FAIL. Use when user says 'verify rules', 'check rules', or 'are rules loaded?'."
  disable-model-invocation: true
  allowed-tools: "list_dir read_file"

verify-skills:
  name: "verify-skills"
  description: "Verify all skills are present on disk and indexed in the current conversation — returns PASS or FAIL. Use when user says 'verify skills', 'check skills', or 'are skills loaded?'."
  disable-model-invocation: true
  allowed-tools: "list_dir read_file"

verify-agents:
  name: "verify-agents"
  description: "Verify all agents are present on disk and indexed in the current conversation — returns PASS or FAIL. Use when user says 'verify agents', 'check agents', or 'are agents loaded?'."
  disable-model-invocation: true
  allowed-tools: "list_dir read_file"

verification-loop:
  name: "verification-loop"
  description: "Run a structured quality-gate pipeline (Build → Type Check → Lint → Tests → Security Scan → Diff Review) and produce a pass/fail report. Use before committing, creating a PR, or when user says 'verify', 'check everything', 'run quality gates', or 'pre-flight'."
  allowed-tools: "run_in_terminal read_file grep_search list_dir"
  argument-hint: "[optional: specific gate to run, e.g. 'tests only']"

search-first:
  name: "search-first"
  description: "Research existing solutions before writing new code — search codebase, GitHub, library docs, package registries, MCP servers, and web. Use when implementing a non-trivial feature, adding a dependency, or exploring prior art. Triggers on 'find a library for', 'is there an MCP for', 'how do others do X', or 'search first'."
  allowed-tools: "run_in_terminal read_file grep_search semantic_search"
  argument-hint: "[topic or feature to research]"

github-issues:
  name: "github-issues"
  description: "Create, update, and manage GitHub issues using MCP tools. Use this skill when users want to create bug reports, feature requests, or task issues, update existing issues, add labels/assignees/milestones, set issue fields (dates, priority, custom fields), set issue types, manage issue workflows, link issues, add dependencies, or track blocked-by/blocking relationships. Triggers on requests like 'create an issue', 'file a bug', 'request a feature', 'update issue X', 'set the priority', 'set the start date', 'link issues', 'add dependency', 'blocked by', 'blocking', or any GitHub issue management task."
  allowed-tools: "run_in_terminal"
  argument-hint: "[issue title, number, or URL]"

backend-patterns:
  name: "backend-patterns"
  description: "Production-ready backend patterns — service layer, repository, error handling, DB access, caching, auth, rate limiting, background jobs, and structured logging. Use when building or reviewing API services."
  allowed-tools: "read_file semantic_search"
  argument-hint: "[pattern: service-layer|caching|auth|rate-limiting|logging]"

frontend-patterns:
  name: "frontend-patterns"
  description: "React / Next.js patterns — component composition, custom hooks, state management, data fetching, forms, performance, error boundaries, and accessibility. Use when building or reviewing frontend code."
  allowed-tools: "read_file semantic_search"
  argument-hint: "[pattern: components|hooks|state|forms|performance|a11y]"

deployment-patterns:
  name: "deployment-patterns"
  description: "Deployment strategies (rolling, blue-green, canary), health checks, environment config, rollback procedures, and production readiness checklists. Use when designing or reviewing deployment pipelines."
  allowed-tools: "read_file semantic_search"
  argument-hint: "[pattern: rolling|blue-green|canary|health-checks|rollback]"

docker-patterns:
  name: "docker-patterns"
  description: "Docker and Docker Compose patterns — multi-stage builds, local dev setup, volumes, networking, container security, and .dockerignore. Use when dockerizing applications or reviewing Dockerfiles."
  allowed-tools: "read_file semantic_search"
  argument-hint: "[pattern: dockerfile|compose|volumes|networking|security]"

database-migrations:
  name: "database-migrations"
  description: "Safe database migration patterns — zero-downtime strategies, expand-contract, ORM workflows (Prisma, Django, Alembic, golang-migrate), and anti-patterns. Use when adding, modifying, or reviewing migrations."
  allowed-tools: "read_file semantic_search run_in_terminal"
  argument-hint: "[migration type: add-column|rename|remove|index|data-migration]"

api-design:
  name: "api-design"
  description: "REST API design patterns — resource naming, HTTP methods, status codes, response format, pagination, filtering, sorting, rate limiting, and versioning. Use when designing or reviewing API endpoints."
  allowed-tools: "read_file semantic_search"
  argument-hint: "[topic: resources|status-codes|pagination|filtering|versioning]"

security-review:
  name: "security-review"
  description: "Interactive security audit — 10-point checklist covering secrets, input validation, SQL injection, auth, XSS, CSRF, rate limiting, data exposure, dependencies, and infrastructure. Use when auditing code before shipping."
  allowed-tools: "read_file grep_search semantic_search get_changed_files run_in_terminal"
  argument-hint: "[scope: file path, module, or 'full']"

langfuse:
  name: "langfuse"
  description: "Interact with Langfuse and access its documentation: query or modify traces, prompts, datasets, scores, and sessions via the langfuse-cli, look up concepts/integration/SDK guides, instrument apps, migrate prompts, and debug traces. Use when working with Langfuse observability, the OTel collector pipeline, or per-spoke cost/latency analysis."
  argument-hint: "[topic: instrumentation|cli|error-analysis|prompt-migration|judge-calibration]"
