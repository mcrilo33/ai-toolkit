# Per-tool hook definitions.
# Key = script filename without .sh extension.
# Each hook maps to one or more platform-specific configurations.
#
# Shared fields:
#   event       — the lifecycle event (see hooks-frontmatter.md for mapping)
#   matcher     — tool/command filter (platform-specific semantics)
#   if          — Claude-only: fine-grained permission rule syntax
#   description — human-readable purpose
#   tier        — 1 (high value) / 2 (medium) / 3 (nice-to-have)
#   timeout     — max seconds (default: 30)
#
# Per-tool overrides nested under copilot/cursor/claude keys.
#
# Cursor migration (3.7.21): the top-level event/matcher is the CANONICAL
# (Claude/Copilot) wiring and stays unchanged. The nested `cursor:` block
# remaps each hook onto Cursor's DEDICATED events (beforeShellExecution,
# afterFileEdit) which deliver the real command/file payload at the top level;
# the generic preToolUse/postToolUse path delivered an internal scratch
# payload. On beforeShellExecution the `matcher` is a COMMAND REGEX; on
# afterFileEdit it filters by the dedicated tool token (Write|TabWrite).

block-no-verify:
  event: preToolUse
  matcher: Bash
  description: "Block git commands that use --no-verify flag"
  tier: 1
  claude:
    if: "Bash(git * --no-verify *)"
  cursor:
    event: beforeShellExecution
    matcher: ""

secrets-scan:
  event: preToolUse
  matcher: "Write|Edit"
  description: "Scan for hardcoded secrets (API keys, tokens) before writing files"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +(add|commit)( |$)"

secrets-scan-revert:
  event: postToolUse
  matcher: "Write|Edit"
  description: "Revert a file whose edit introduced a hardcoded secret (Cursor afterFileEdit early containment)"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: afterFileEdit
    matcher: "Write|TabWrite"

git-push-review:
  event: preToolUse
  matcher: Bash
  description: "Show diff summary before git push for review"
  tier: 2
  claude:
    if: "Bash(git push *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +push( |$)|gh +pr( |$)"

push-scope-guard:
  event: preToolUse
  matcher: Bash
  description: "Spoke worktrees may push only their own branch; the default branch is published by the hub (hard deny on Cursor, advisory elsewhere)"
  tier: 1
  claude:
    if: "Bash(git push *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +push( |$)"

config-protection:
  event: preToolUse
  matcher: "Write|Edit"
  description: "Block modification of linter, formatter, and CI config files"
  tier: 2
  copilot:
    matcher: "edit|create"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +(add|commit)( |$)"

hub-guard:
  event: preToolUse
  matcher: "Edit|Write|NotebookEdit|Bash"
  description: "On the main checkout's default branch (the planning hub), block file edits, commits, and task-branch creation; point to start-task"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +(commit|checkout|switch|branch)( |$)"

post-edit-format:
  event: postToolUse
  matcher: "Edit|Write"
  description: "Auto-format edited files using the project's configured formatter"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: afterFileEdit
    matcher: "Write|TabWrite"

quality-gate:
  event: postToolUse
  matcher: "Edit|Write"
  description: "Run linter and typechecker on edited files"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: afterFileEdit
    matcher: "Write|TabWrite"

console-log-warn:
  event: postToolUse
  matcher: "Edit|Write"
  description: "Warn when console.log, print(), or debug statements are added"
  tier: 2
  copilot:
    matcher: "edit|create"
  cursor:
    event: afterFileEdit
    matcher: "Write|TabWrite"

commit-quality:
  event: preToolUse
  matcher: Bash
  description: "Validate commit message format and issue-anchor before commit"
  tier: 2
  claude:
    if: "Bash(git commit *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +commit( |$)"

commit-gauntlet:
  event: preToolUse
  matcher: Bash
  description: "Run linters/typecheckers on staged files before commit; block on failure"
  tier: 1
  timeout: 60
  claude:
    if: "Bash(git commit *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +commit( |$)"

red-proof-verify:
  event: preToolUse
  matcher: Bash
  description: "Run each Tested-RED node at commit time; block if it PASSES (not a real RED test)"
  tier: 1
  timeout: 60
  claude:
    if: "Bash(git commit *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +commit( |$)"

red-proof-warn:
  event: preToolUse
  matcher: Bash
  description: "On push: enforce Tested-RED trailer presence and that each Tested-RED node passes"
  tier: 2
  timeout: 60
  claude:
    if: "Bash(git push *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +push( |$)|gh +pr( |$)"

reviewer-sep-warn:
  event: preToolUse
  matcher: Bash
  description: "On push: verify an APPROVE review-evidence artifact bound to the pushed diff hash"
  tier: 2
  claude:
    if: "Bash(git push *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +push( |$)|gh +pr( |$)"

todo-ledger-warn:
  event: preToolUse
  matcher: Bash
  description: "On push: verify a task ledger (TodoWrite or Tasks) was seeded this session (transcript scan); No-Ledger: trailer bypasses"
  tier: 2
  claude:
    if: "Bash(git push *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +push( |$)|gh +pr( |$)"

todo-ledger-nudge:
  event: sessionStart
  description: "At session start, nudge the agent to seed a task ledger (TodoWrite or Tasks) before the first commit (advisory; companion of todo-ledger-warn)"
  tier: 3

afk-notify-wake:
  event: notification
  description: "On a permission/question Notification, announce the parked spoke to a live /afk supervisor (spool a wake event + SIGUSR1) so it is serviced without waiting a full tick (Claude-only, #176)"
  tier: 2

delegation-gate-warn:
  event: preToolUse
  matcher: Bash
  description: "Warn with delegation hints for specialist agents based on command and diff heuristics"
  tier: 2
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +push( |$)|gh +pr( |$)"

# Review-stamp window hooks (Cursor-only): the event is defined ONLY in the
# cursor: block, so the generator skips Claude/Copilot (empty canonical event).
# beforeMCPExecution gates the review-stamp MCP approve_review tool behind a
# live code-review window; subagentStart/Stop open and close that window.

review-stamp-guard:
  description: "Gate the review-stamp approve_review MCP tool behind a fresh code-review window"
  tier: 1
  # Claude wiring (#139): telemetry-only — the guard emits the step:review
  # cycle marker and allows (enforcement in Claude Code is the per-agent MCP
  # wiring). The event lives in the claude block, NOT top-level, so Copilot
  # (which has no per-tool block here) stays unwired.
  claude:
    event: preToolUse
    matcher: "mcp__review-stamp__approve_review"
  cursor:
    event: beforeMCPExecution
    matcher: "approve_review"
    failClosed: "true"

review-window-open:
  description: "Open the review window (.review/.window) when a code-review subagent starts"
  tier: 1
  cursor:
    event: subagentStart

review-window-close:
  description: "Close the review window when a code-review subagent stops"
  tier: 1
  cursor:
    event: subagentStop

# rm-scope-guard (issue #13): auto-allow rm whose every target provably
# resolves inside the worktree or /tmp//private/tmp (and, for compound
# commands, whose every chained segment is read-only); stay SILENT otherwise
# so the user's `Bash(rm *)` ask rule keeps prompting. The hook never denies —
# platforms without permissionDecision support simply keep prompting. Wired
# like hub-guard/git-push-review: Claude gates it with the same `Bash(rm *)`
# rule the ask backstop uses; Cursor remaps onto beforeShellExecution with a
# command regex that fires on rm at a segment boundary.
rm-scope-guard:
  event: preToolUse
  matcher: Bash
  description: "Auto-allow rm scoped to the worktree or /tmp (read-only chained segments only); stay silent otherwise so the ask rule still prompts"
  tier: 1
  claude:
    if: "Bash(rm *)"
  cursor:
    event: beforeShellExecution
    matcher: "(^|[;&|] *)rm( |$)"

# chmod-scope-guard (issue #27): the third scope-guard sibling (rm → push →
# chmod). Auto-allow a chmod that uses a provably-safe mode (no setuid/setgid,
# no world/group-write, not recursive) on static literal targets strictly
# inside the project root — and, for compound commands, whose every other
# segment is read-only or a pytest invocation. Stay SILENT otherwise so the
# user's `Bash(chmod *)` ask rule keeps prompting. Never denies. Wired exactly
# like rm-scope-guard: Claude gates it with the same `Bash(chmod *)` rule the
# ask backstop uses; Cursor remaps onto beforeShellExecution with a command
# regex that fires on chmod at a segment boundary.
chmod-scope-guard:
  event: preToolUse
  matcher: Bash
  description: "Auto-allow chmod with a safe mode on static in-repo targets (read-only/pytest chained segments only); stay silent otherwise so the ask rule still prompts"
  tier: 1
  claude:
    if: "Bash(chmod *)"
  cursor:
    event: beforeShellExecution
    matcher: "(^|[;&|] *)chmod( |$)"

# spoke-main-guard (issue #32): the DENY mirror of the allow-or-silent
# rm/push/chmod scope guards. In a spoke (WT_SPOKE set, or a linked worktree) it
# DENIES any command that checks out or mutates the LOCAL default-branch ref —
# checkout/switch main, merge while on main, branch -f/move/delete/bare-create of
# main, push to the local main ref, update-ref refs/heads/main, reset while on
# main, and invoking worktree-land.sh — closing the self-land hole push-scope-
# guard (#26) left open (it blocked the push, not the local merge into main). The
# sanctioned reconciliation flow (git merge origin/main into the feature branch,
# git fetch) and all own-branch work stay allowed; on the hub it is a no-op.
# Unlike the if-gated rm/push/chmod guards it spans many git subcommands, so
# Claude wires it with NO `if` (matcher Bash; the script self-filters), exactly
# like hub-guard. Cursor remaps onto beforeShellExecution with a command regex
# firing on the ref-touching verbs and the land script (the `-[cC] <val>`
# alternative leads so a `-c key=val` value is consumed and cannot break the
# chain to the verb).
spoke-main-guard:
  event: preToolUse
  matcher: Bash
  description: "In a spoke (WT_SPOKE/linked worktree), DENY any command that checks out or mutates the local default branch (checkout/switch/merge-into/branch -f/push-to-local/update-ref/reset-on/worktree-land.sh); reconciliation (merge origin/main into the feature branch, fetch) stays allowed; hub is a no-op"
  tier: 1
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[cC] +[^ ]+| +-[^ ]+)* +(checkout|switch|merge|branch|reset|update-ref|push)( |$)|worktree-land[.]sh"

# plan-gate-guard (issue #173): enforce the PLAN-gate park. While a gate/<N> tag
# sits at the branch tip (N from the branch slug) the spoke is parked awaiting
# review, so this DENIES Edit/Write/NotebookEdit and `git commit` — parking
# becomes physics, not a request (#117). Reads, searches, git status/diff, and
# spoke-ready.sh stay allowed; the gate answer path deletes the tag
# (_consume_gate_tag), which un-blocks with no new machinery. Like hub-guard it
# spans both the file-edit tools and Bash, so on Claude it carries NO `if` clause
# (matcher "Edit|Write|NotebookEdit|Bash", the script self-filters). Cursor has no
# pre-file-edit dedicated event, so — mirroring config-protection — it remaps onto
# beforeShellExecution and enforces the park at commit time.
plan-gate-guard:
  event: preToolUse
  matcher: "Edit|Write|NotebookEdit|Bash"
  description: "While gate/<N> sits at the branch tip (PLAN-gate park), DENY Edit/Write/NotebookEdit and git commit; reads, searches, git status/diff, and spoke-ready.sh stay allowed. Un-blocks when the gate tag is consumed or the tip advances"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[cC] +[^ ]+| +-[^ ]+)* +commit( |$)"

# parent-span-export (issue #66): telemetry Phase 2 — script causality. On every
# Bash call, record the tool_use_id to <root>/.ai-toolkit/parent-span; telemetry.sh
# reads it (after $AI_TOOLKIT_PARENT_SPAN, before the spoke root) so agent-run
# scripts and the native git-hooks they trigger emit spans with the causal
# parent_id. It does NOT rewrite the command — prepending a `VAR=value` assignment
# would break the exact-match Bash allowlist (env-assignment prefixes are not
# stripped before matching — anthropics/claude-code#15292), re-prompting every
# allowlisted spoke command. NO `if` — it must see every Bash command (it self-
# skips when telemetry is off, jq is absent, or there is no clean tool_use_id, and
# writes nothing to stdout so it composes with the scope-guard hooks). No Cursor/
# Copilot remap: the tool_use_id lives in the Claude payload; elsewhere it no-ops.
parent-span-export:
  event: preToolUse
  matcher: Bash
  description: "Record the Bash tool_use_id to .ai-toolkit/parent-span so scripts and native git-hooks emit telemetry spans with the causal parent_id; no command rewrite; no-op when telemetry is off"
  tier: 2

# cycle-step-mark (issue #178): derive the solo-cycle step markers from the
# mechanical witness of each transition instead of LLM narration — a git commit's
# HEAD message (Tested-RED -> red, else green), a branch push that advanced
# @{upstream} (-> push), and a new .review/<hash>.json artifact (-> review). All
# emission routes through the idempotent telemetry_mark_cycle_step, so it dedupes
# per (phase, HEAD) with the #139 gate emitters (review-stamp-guard, spoke-push.sh)
# and fills the gaps they miss (RED/GREEN had no marker; an Agent-tool code-review
# never hits the review-stamp MCP; a mid-cycle/quick-lane push never runs
# spoke-push.sh). Like spoke-main-guard it spans two tool types (Bash for
# commit/push, Write for the .review artifact), so it carries NO `if` and the script
# self-filters. Claude-only + telemetry-only: the spokecycle trace is a Claude Code
# concept, so — like afk-notify-wake — the event lives in the claude block and
# Copilot/Cursor stay unwired (review-stamp-guard already owns Cursor's review path).
cycle-step-mark:
  description: "Derive solo-cycle step markers (red/green/review/push) from commit/push/review witnesses on PostToolUse; telemetry-only, idempotent per (phase, HEAD)"
  tier: 3
  claude:
    event: postToolUse
    matcher: "Bash|Write"

# ledger-schema-guard (issue #235): enforce the todo-ledger entry schema so
# scripted cycle steps and ad-hoc todos stay aggregable. Every TaskCreate /
# subject-changing TaskUpdate subject must read `<subtask-id> · <STEP|type> —
# <label>` (STEP from ANCHOR/RED/GREEN/REVIEW/PUSH; an ad-hoc entry carries a type
# from investigate|fix|test|docs|chore|recover); a non-conforming write is DENIED
# with the expected format (same UX as commit-gauntlet). Spoke-only (WT_SPOKE), so
# the hub / quick lanes are never blocked. Claude-only + a Claude-tool matcher:
# TaskCreate/TaskUpdate are Claude Code ledger tools with no Cursor/Copilot analog,
# so — like cycle-step-mark and afk-notify-wake — the event lives in the claude
# block and Copilot/Cursor stay unwired (empty canonical event).
ledger-schema-guard:
  description: "Enforce the todo-ledger entry schema (<subtask-id> · <STEP|type> — <label>) on TaskCreate/TaskUpdate; deny non-conforming/merged/free-form entries with the expected format (spoke-only)"
  tier: 1
  claude:
    event: preToolUse
    matcher: "TaskCreate|TaskUpdate"

# afk-permission-hook (issue #253): answer a spoke's permission decision
# PROGRAMMATICALLY on PreToolUse instead of pane-scraping a tmux dialog after it
# appears (the #240/#246/#238 bug family). It runs the SAME classify_permission
# verdict the /afk drain already trusts and auto-approves a benign scoped self-op
# (permissionDecision:"allow"), so no dialog is ever shown and there is nothing to
# scrape; it journals the auto-approve per #241. It NEVER denies — an ESCALATE or
# any un-gated context stays silent, so the scope-guard hooks' denies stay
# authoritative and the rare genuine escalation still falls through to the drain
# reasoner. Self-limits to a LIVE /afk drain (a running .afk-heartbeat supervisor)
# on an issue-numbered spoke branch, so attended sessions and the hub checkout are
# untouched. Claude-only, like afk-notify-wake: the /afk drain + Claude Code
# permission protocol are a Claude Code concept, so the event lives in the claude
# block and Copilot/Cursor stay unwired. Placed LAST among the preToolUse hooks so
# its matcher group emits after the scope-guards' — a never-deny hook whose allow
# is a strict subset of what those guards permit, so no double-gating / no bypass.
afk-permission-hook:
  description: "On PreToolUse (Bash/Read) inside a live /afk drain, auto-approve a benign scoped self-op via classify_permission (permissionDecision:allow) so no tmux dialog is shown; never denies; journals per #241 (Claude-only, #253)"
  tier: 1
  claude:
    event: preToolUse
    matcher: "Bash|Read"

# afk-danger-guard (issue #261): the PreToolUse deny-WALL for afk spokes launched
# under bypassPermissions (worktree-new.sh --mode afk raises no dialog, so a
# deny-hook is the safety boundary; a deny-hook still fires + is honored under
# bypass). It runs the same classifiers the drain trusts: classify_danger (Tier 2,
# static boundary-crossing blacklist -- checked FIRST, deny-first) -> classify_permission
# (Tier 1, benign self-op -> allow silently) -> a toolless Haiku judge (Tier 3, the
# ambiguous residue, fail-closed on timeout/error). It emits ONLY permissionDecision:
# "deny" (never allow -- afk-permission-hook keeps that role) and journals every deny +
# verdict per #241. Gated on a fail-safe MODE gate (.ai-toolkit/mode: positively-afk
# keeps the wall ACTIVE on any branch even if the supervisor died or HEAD detached;
# positively-attended -> inert; missing mode -> active only on an issue-numbered spoke
# branch), so the hub / attended lanes are never walled. Claude-only, like
# afk-permission-hook. NOTE: this hook emits ONLY deny and afk-permission-hook ONLY allow;
# when both fire on one command CC resolves deny-over-allow by VERDICT-TYPE PRECEDENCE, not
# by emission order (the generator sorts hooks by name, so this one actually emits first) --
# so the two compose safely regardless of order.
afk-danger-guard:
  description: "On PreToolUse (Bash/Read) inside an afk bypass spoke, DENY boundary-crossing / judge-dangerous commands (classify_danger -> classify_permission -> toolless Haiku judge, fail-closed); the safety wall for bypassPermissions; journals per #241 (Claude-only, #261)"
  tier: 1
  claude:
    event: preToolUse
    matcher: "Bash|Read"
