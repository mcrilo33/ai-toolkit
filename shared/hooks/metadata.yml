# Per-tool hook definitions.
# Key = script filename without .sh extension.
# Each hook maps to one or more platform-specific configurations.
#
# Shared fields:
#   event       — the lifecycle event (see hooks-frontmatter.md for mapping)
#   matcher     — tool/command filter (platform-specific semantics)
#   if          — Claude-only: fine-grained permission rule syntax
#   description — human-readable purpose
#   tier        — 1 (high value) / 2 (medium) / 3 (nice-to-have)
#   timeout     — max seconds (default: 30)
#
# Per-tool overrides nested under copilot/cursor/claude keys.
#
# Cursor migration (3.7.21): the top-level event/matcher is the CANONICAL
# (Claude/Copilot) wiring and stays unchanged. The nested `cursor:` block
# remaps each hook onto Cursor's DEDICATED events (beforeShellExecution,
# afterFileEdit) which deliver the real command/file payload at the top level;
# the generic preToolUse/postToolUse path delivered an internal scratch
# payload. On beforeShellExecution the `matcher` is a COMMAND REGEX; on
# afterFileEdit it filters by the dedicated tool token (Write|TabWrite).

block-no-verify:
  event: preToolUse
  matcher: Bash
  description: "Block git commands that use --no-verify flag"
  tier: 1
  claude:
    if: "Bash(git * --no-verify *)"
  cursor:
    event: beforeShellExecution
    matcher: ""

secrets-scan:
  event: preToolUse
  matcher: "Write|Edit"
  description: "Scan for hardcoded secrets (API keys, tokens) before writing files"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +(add|commit)( |$)"

secrets-scan-revert:
  event: postToolUse
  matcher: "Write|Edit"
  description: "Revert a file whose edit introduced a hardcoded secret (Cursor afterFileEdit early containment)"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: afterFileEdit
    matcher: "Write|TabWrite"

git-push-review:
  event: preToolUse
  matcher: Bash
  description: "Show diff summary before git push for review"
  tier: 2
  claude:
    if: "Bash(git push *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +push( |$)|gh +pr( |$)"

config-protection:
  event: preToolUse
  matcher: "Write|Edit"
  description: "Block modification of linter, formatter, and CI config files"
  tier: 2
  copilot:
    matcher: "edit|create"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +(add|commit)( |$)"

hub-guard:
  event: preToolUse
  matcher: "Edit|Write|NotebookEdit|Bash"
  description: "On the main checkout's default branch (the planning hub), block file edits, commits, and task-branch creation; point to start-task"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +(commit|checkout|switch|branch)( |$)"

post-edit-format:
  event: postToolUse
  matcher: "Edit|Write"
  description: "Auto-format edited files using the project's configured formatter"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: afterFileEdit
    matcher: "Write|TabWrite"

quality-gate:
  event: postToolUse
  matcher: "Edit|Write"
  description: "Run linter and typechecker on edited files"
  tier: 1
  copilot:
    matcher: "edit|create"
  cursor:
    event: afterFileEdit
    matcher: "Write|TabWrite"

console-log-warn:
  event: postToolUse
  matcher: "Edit|Write"
  description: "Warn when console.log, print(), or debug statements are added"
  tier: 2
  copilot:
    matcher: "edit|create"
  cursor:
    event: afterFileEdit
    matcher: "Write|TabWrite"

commit-quality:
  event: preToolUse
  matcher: Bash
  description: "Validate commit message format and issue-anchor before commit"
  tier: 2
  claude:
    if: "Bash(git commit *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +commit( |$)"

commit-gauntlet:
  event: preToolUse
  matcher: Bash
  description: "Run linters/typecheckers on staged files before commit; block on failure"
  tier: 1
  timeout: 60
  claude:
    if: "Bash(git commit *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +commit( |$)"

red-proof-verify:
  event: preToolUse
  matcher: Bash
  description: "Run each Tested-RED node at commit time; block if it PASSES (not a real RED test)"
  tier: 1
  timeout: 60
  claude:
    if: "Bash(git commit *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +commit( |$)"

red-proof-warn:
  event: preToolUse
  matcher: Bash
  description: "On push: enforce Tested-RED trailer presence and that each Tested-RED node passes"
  tier: 2
  timeout: 60
  claude:
    if: "Bash(git push *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +push( |$)|gh +pr( |$)"

reviewer-sep-warn:
  event: preToolUse
  matcher: Bash
  description: "On push: verify an APPROVE review-evidence artifact bound to the pushed diff hash"
  tier: 2
  claude:
    if: "Bash(git push *)"
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +push( |$)|gh +pr( |$)"

delegation-gate-warn:
  event: preToolUse
  matcher: Bash
  description: "Warn with delegation hints for specialist agents based on command and diff heuristics"
  tier: 2
  cursor:
    event: beforeShellExecution
    matcher: "git( +-[^ ]+| +-C +[^ ]+)* +push( |$)|gh +pr( |$)"

# Review-stamp window hooks (Cursor-only): the event is defined ONLY in the
# cursor: block, so the generator skips Claude/Copilot (empty canonical event).
# beforeMCPExecution gates the review-stamp MCP approve_review tool behind a
# live code-review window; subagentStart/Stop open and close that window.

review-stamp-guard:
  description: "Gate the review-stamp approve_review MCP tool behind a fresh code-review window"
  tier: 1
  cursor:
    event: beforeMCPExecution
    matcher: "approve_review"
    failClosed: "true"

review-window-open:
  description: "Open the review window (.review/.window) when a code-review subagent starts"
  tier: 1
  cursor:
    event: subagentStart

review-window-close:
  description: "Close the review window when a code-review subagent stops"
  tier: 1
  cursor:
    event: subagentStop
