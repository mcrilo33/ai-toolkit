id: 301-dead-agent-not-injected
stresses:
  incident: 301
  invariant: I5
  principle: "4"
spokes:
  - issue: 301
    slug: crash
    truth:
      agent: dead
      recovers: true
timeline:
  # The spoke parks on a question, then its agent dies: the worker-list row reports
  # `exited` while the inbox question is still unread (the #301 shape).
  - { t: 0, spoke: 301, do: park }
  - { t: 10, spoke: 301, do: kill_agent }
  # The drain must read the exited worker, never inject into its terminal, and recover
  # it instead.
  - { t: 20, run: [drain] }
expect:
  violations: []
mutation:
  # The stub reports a live worker for an exited one (the liveness probe LIES), so the
  # drain treats the dead agent as parked-and-alive and never recovers it.
  report_live: true
  expect_violation: I5
