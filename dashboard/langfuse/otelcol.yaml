# OpenTelemetry Collector — Claude Code spoke telemetry → Langfuse.
#
# Claude Code emits native OTLP traces, but two things must be transformed before
# Langfuse can use them (validated against Claude Code v2.1.183):
#
#   1. Token remap. Claude Code emits bare `input_tokens` / `output_tokens`; Langfuse
#      reads usage only from `gen_ai.usage.*`. Without this remap, cost reads $0.
#   2. Span-name rewrite. Every tool span is named `claude_code.tool`; rewriting the
#      name to encode the dimension (`tool:Bash`, `hook:PreToolUse:Bash`, `sub-agent:llm`, `sub-agent:Explore`)
#      makes Langfuse's "group by name" give cost & latency PER tool / hook / sub-agent.
#   3. Content mapping. user_prompt + tool command/output (opt-in OTEL_LOG_* flags) →
#      langfuse.observation.input/output so prompts and per-tool I/O render. LLM
#      assistant text is not in traces (it goes to the OTel logs signal).
#   4. Message bridge. The LLM request/response bodies (the conversation messages) ride
#      the OTel *logs* signal (api_request_body / api_response_body) with no trace ids, so
#      Langfuse can't attach them. This config forks BOTH traces and a new `logs` pipeline
#      to an out-of-band sidecar — scripts/telemetry/langfuse_message_bridge.py via the
#      `otlphttp/bridge` exporter (${env:BRIDGE_OTLP_ENDPOINT}) — which joins
#      prompt.id→request_id→span_id and PATCHes each llm_request observation's input/output.
#      The spoke must export OTEL_LOGS_EXPORTER=otlp and OTEL_LOG_RAW_API_BODIES=1 to emit
#      the bodies. Caveat: request bodies over ~60KB are truncated by Claude Code (invalid
#      JSON → the bridge stores the raw partial as input); thinking blocks arrive <REDACTED>.
#
# It also re-homes each span's Langfuse session onto the spoke (`spoke_run_id`), so one
# spoke — across Claude Code resumes — is one Langfuse session.
#
# Run (Mac/Docker), with the Langfuse target supplied by the operator (kept off the
# command line so the auth token never lands in `ps`):
#
#   export LANGFUSE_OTLP_ENDPOINT=http://host.docker.internal:3000/api/public/otel
#   export LANGFUSE_BASIC_AUTH="Basic $(printf 'pk-lf-…:sk-lf-…' | base64)"
#   export BRIDGE_OTLP_ENDPOINT=http://host.docker.internal:4319   # the message-bridge sidecar
#   docker run -d --name lf-collector --add-host=host.docker.internal:host-gateway \
#     -p 4317:4317 -p 4318:4318 -p 4418:4418 -p 8889:8889 \
#     -e LANGFUSE_OTLP_ENDPOINT -e LANGFUSE_BASIC_AUTH -e BRIDGE_OTLP_ENDPOINT \
#     -v "$PWD/dashboard/langfuse/otelcol.yaml:/etc/otelcol-contrib/config.yaml" \
#     otel/opentelemetry-collector-contrib:latest
#   # 4317 normal OTLP gRPC (spoke traces+logs+metrics) · 4318 OTLP HTTP (compat +
#   # bridge fork) · 4418 beta detailed-tracing HTTP · 8889 Prometheus scrape.
#   # Metrics route to Prometheus, NOT Langfuse (issue #88).
#
# Run the message bridge on the host (it receives the forked traces+logs on :4319):
#   LANGFUSE_BASIC_AUTH="$LANGFUSE_BASIC_AUTH" \
#     python3 scripts/telemetry/langfuse_message_bridge.py
#
# Then point a spoke at it (the Issue #83 opt-in gate already wires the rest, incl.
# OTEL_EXPORTER_OTLP_PROTOCOL=grpc for the normal stream). The two OTEL_LOG_RAW_API_BODIES
# / OTEL_LOGS_EXPORTER vars make Claude Code emit the LLM message bodies on the logs
# signal the bridge consumes. The normal endpoint is the gRPC :4317; BETA_TRACING_ENDPOINT
# is the separate beta HTTP port (:4418) — pointed at the normal endpoint it SILENTLY
# kills all trace+log export (issue #88 footgun):
#   AI_TOOLKIT_OTEL=1  OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 \
#   ENABLE_BETA_TRACING_DETAILED=1  BETA_TRACING_ENDPOINT=http://localhost:4418 \
#   OTEL_LOG_USER_PROMPTS=1  OTEL_LOG_TOOL_DETAILS=1  OTEL_LOG_TOOL_CONTENT=1 \
#   OTEL_LOGS_EXPORTER=otlp  OTEL_LOG_RAW_API_BODIES=1 \
#     scripts/worktree-new.sh <issue> <slug>

receivers:
  # Normal OTLP stream — traces + logs + metrics. The spoke exports these over gRPC
  # (:4317) because the beta detailed exporter is HTTP-only (see otlp/beta below):
  # normal takes gRPC, beta takes HTTP — the arrangement proven to land
  # response.model_output end-to-end in Langfuse (issue #88). The http :4318 listener
  # is kept for backward compat — pre-#88 spokes export there and their logs feed the
  # message-bridge fork. Downstream transforms are protocol-agnostic, so both land in
  # the same pipeline.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Beta detailed-tracing stream (ENABLE_BETA_TRACING_DETAILED, issue #88). Claude
  # Code exports the detailed spans (response.model_output, system_reminders,
  # new_context, per-tool hash) to BETA_TRACING_ENDPOINT over HTTP. It MUST hit a
  # different host:port than the normal OTLP endpoint above, or it SILENTLY kills ALL
  # trace+log export (metrics still flow). A dedicated HTTP port keeps it disjoint;
  # it feeds the one Langfuse traces pipeline.
  otlp/beta:
    protocols:
      http:
        endpoint: 0.0.0.0:4418

processors:
  batch: {}
  transform/langfuse:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # 1) token remap → Langfuse usage/cost
          - set(attributes["gen_ai.usage.input_tokens"], attributes["input_tokens"]) where attributes["input_tokens"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["output_tokens"]) where attributes["output_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_read_input_tokens"], attributes["cache_read_tokens"]) where attributes["cache_read_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_creation_input_tokens"], attributes["cache_creation_tokens"]) where attributes["cache_creation_tokens"] != nil
          # 2) span-name rewrite → "group by name" = per tool / skill / hook / sub-agent
          - set(name, Concat(["tool:", attributes["tool_name"]], "")) where name == "claude_code.tool" and attributes["tool_name"] != nil
          - set(name, Concat(["hook:", attributes["hook_name"]], "")) where name == "claude_code.hook" and attributes["hook_name"] != nil
          - set(name, "sub-agent:llm") where name == "claude_code.llm_request" and attributes["agent_id"] != nil
          - set(name, Concat(["sub-agent:", attributes["subagent_type"]], "")) where attributes["tool_name"] == "Agent" and attributes["subagent_type"] != nil
          # 3) spoke grouping → one spoke (across resumes) = one Langfuse session.
          #    Langfuse reads the session from span attributes, precedence
          #    langfuse.session.id > session.id. Claude Code sets session.id to its own
          #    per-session UUID, so we set the higher-precedence langfuse.session.id to
          #    win (verified 2026-06-19: span session.id alone grouped under the UUID).
          - set(attributes["langfuse.session.id"], resource.attributes["spoke_run_id"]) where resource.attributes["spoke_run_id"] != nil
          - set(attributes["session.id"], resource.attributes["spoke_run_id"]) where resource.attributes["spoke_run_id"] != nil
          # 4) content → Langfuse input/output. Opt-in: needs OTEL_LOG_USER_PROMPTS +
          #    OTEL_LOG_TOOL_DETAILS + OTEL_LOG_TOOL_CONTENT at spoke launch (these ship
          #    content off-box, so they are operator opt-in, NOT in the #83 gate). The
          #    LLM assistant text is NOT available — Claude Code routes raw API bodies to
          #    the OTel logs signal, which Langfuse trace ingestion does not read.
          - set(attributes["langfuse.observation.input"], attributes["user_prompt"]) where attributes["user_prompt"] != nil
          - set(attributes["langfuse.observation.input"], attributes["full_command"]) where attributes["full_command"] != nil
          # 5) detailed tracing (ENABLE_BETA_TRACING_DETAILED, issue #88). The beta
          #    stream carries the assistant output and per-turn context on span attrs:
          #    response.model_output → the observation output (the LLM text the trace
          #    signal otherwise lacks); new_context / system_reminders → metadata. The
          #    langfuse.observation.metadata.* prefix surfaces them as filterable
          #    top-level keys (a bare attr nests under metadata.attributes instead).
          #    PII (user.email/id, account_uuid) rides these spans, so the detailed
          #    stream stays operator opt-in, same as the content flags above.
          - set(attributes["langfuse.observation.output"], attributes["response.model_output"]) where attributes["response.model_output"] != nil
          - set(attributes["langfuse.observation.metadata.new_context"], attributes["new_context"]) where attributes["new_context"] != nil
          - set(attributes["langfuse.observation.metadata.system_reminders"], attributes["system_reminders"]) where attributes["system_reminders"] != nil
      - context: spanevent
        statements:
          # Tool result/output lives on a span EVENT (TOOL_CONTENT); lift it onto the
          # parent tool span so Langfuse renders per-tool input/output.
          - set(span.attributes["langfuse.observation.output"], attributes["output"]) where attributes["output"] != nil
          - set(span.attributes["langfuse.observation.input"], attributes["bash_command"]) where span.attributes["langfuse.observation.input"] == nil and attributes["bash_command"] != nil

exporters:
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:LANGFUSE_BASIC_AUTH}
  # Forks traces + logs to the host-side message bridge (langfuse_message_bridge.py),
  # which joins the LLM message bodies onto their llm_request observations. JSON encoding
  # (the bridge speaks OTLP/HTTP JSON), no compression, plain HTTP to the host sidecar.
  otlphttp/bridge:
    endpoint: ${env:BRIDGE_OTLP_ENDPOINT}
    encoding: json
    compression: none
    tls:
      insecure: true
  # Metrics sink (issue #88). The spoke's claude_code.token.usage (token-by-type,
  # split by skill.name / agent.name / plugin.name) + cost.usage + active_time
  # metrics flush here — Langfuse is NOT a metrics store, so they route to Prometheus
  # (scrape http://localhost:8889/metrics), never to the Langfuse exporter. For a
  # quick "are metrics flowing?" check, swap this for the `debug` exporter (console).
  # PII (user.email/id) rides every datapoint; account_uuid is already forced off at
  # the spoke (OTEL_METRICS_INCLUDE_ACCOUNT_UUID=false).
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp, otlp/beta]
      processors: [transform/langfuse, batch]
      exporters: [otlphttp/langfuse, otlphttp/bridge]
    # Raw API bodies AND the audit/lifecycle event layer (tool_decision incl. rejections,
    # mcp_server_connection, compaction, permission_mode_changed, plugin_loaded,
    # skill_activated, hook_execution_complete, api_error/api_refusal) arrive on the logs
    # signal; the bridge is their only consumer. It joins the bodies onto llm_request spans
    # and maps each audit event onto a per-spoke synthetic Langfuse trace (issue #93). No
    # OTTL transform is needed — the bridge keys events by the spoke_run_id resource attr.
    logs:
      receivers: [otlp]
      exporters: [otlphttp/bridge]
    # Metrics arrive on the otlp receiver and route to the metrics sink, NOT Langfuse.
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
