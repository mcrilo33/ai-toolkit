# Shared Python tooling config — synced to target repos by sync-to-repo.sh.
# Harmonized stack: ruff (linter + formatter) + pyright (typechecker) + pytest.
# Ruff config lives in ruff.toml (also synced).

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Tests import scripts/ modules after a runtime sys.path.insert; mirror that
# for static analysis so the commit gauntlet's typecheck sees what pytest sees.
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
