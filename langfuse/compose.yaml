# Native-OTel collector for spokes (bin/claude-spoke exports here). Run via scripts/otel.sh,
# which exports LANGFUSE_BASIC_AUTH / LANGFUSE_OTLP_ENDPOINT / AITK_OTEL_RAW_DIR (secrets stay
# out of argv: the valueless `environment` entries forward them from the caller's env).
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: lf-collector
    restart: unless-stopped
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:4418:4418"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: [LANGFUSE_OTLP_ENDPOINT, LANGFUSE_BASIC_AUTH]
    volumes:
      - ./otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ${AITK_OTEL_RAW_DIR:?}:/raw
